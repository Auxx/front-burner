name: Nightly

# CI runs the browser tests in Chromium, on desktop and phone, on every pull
# request and push; this runs them in the other browsers: Firefox on desktop,
# and WebKit on desktop and phone (NF-12.2). Unit and Storybook tests do not
# depend on the browser engine (Storybook's run in Chromium alone), so CI's
# runs cover them. Scheduled runs start only from the default branch.
on:
#  schedule:
#    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# As in ci.yml: the Nx cache inside the workspace, where the setup action can
# save it between runs, within the repository's cache storage.
env:
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: ${{ github.workspace }}/.nx/workspace-data
  NX_MAX_CACHE_SIZE: 1GB

# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
jobs:
  # One job per browser and shard, each with its own Nx cache (see
  # .github/actions/setup), which also holds the builds the tests start. WebKit
  # has twice the tests of Firefox (desktop and phone), so it has more shards.
  # Unchanged code with the same browsers takes the result from the cache.
  web-e2e:
    name: Browser end-to-end tests, ${{ matrix.browser }} (${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas, in the setup action, reads earlier workflow runs.
      actions: read
    strategy:
      # Every shard reports its own failures.
      fail-fast: false
      matrix:
        include:
          - { browser: firefox, shard: 1, shards: 2 }
          - { browser: firefox, shard: 2, shards: 2 }
          - { browser: webkit, shard: 1, shards: 3 }
          - { browser: webkit, shard: 2, shards: 3 }
          - { browser: webkit, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: nightly-${{ matrix.browser }}-${{ matrix.shard }}

      - uses: ./.github/actions/playwright
        with:
          targets: e2e
          projects: web-e2e
          browser: ${{ matrix.browser }}
          affected: 'false'

      - name: Browser end-to-end tests
        run: npx nx run web-e2e:e2e --shard=${{ matrix.shard }}/${{ matrix.shards }}
        env:
          E2E_BROWSERS: ${{ matrix.browser }}

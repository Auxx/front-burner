name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests drop superseded runs; pushes to master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas reads earlier workflow runs to find the last green commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against an earlier commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: master

      - name: Format
        run: npm run format:check

      - name: Project tags
        run: npm run check:tags

      # Storybook stories run as browser tests (A-10.38) and web-e2e runs as
      # end-to-end tests; Chromium is installed only when one of those is
      # affected. Here both run in Chromium alone, as its headless shell;
      # nightly.yml runs every browser (NF-12.2).
      - name: Find affected browser tests
        id: browsers
        run: |
          storybook=$(npx nx show projects --affected -t test-storybook --json)
          e2e=$(npx nx show projects --affected -t e2e --json)
          echo "Affected by test-storybook: $storybook"
          echo "Affected by e2e: $e2e"
          needed=false
          if [ "$storybook" != "[]" ] || [ "$e2e" != "[]" ]; then needed=true; fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.browsers.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browsers.outputs.version }}-chromium-shell

      # Rebuilding the man-page index after every package slows apt down a lot.
      - name: Disable man-db triggers
        if: steps.browsers.outputs.needed == 'true'
        run: sudo rm -f /var/lib/man-db/auto-update

      # On a cache hit this only installs the system packages.
      - name: Install Playwright browsers
        if: steps.browsers.outputs.needed == 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Type check, lint, test, build
        run: npx nx affected -t typecheck lint test build size-check test-storybook e2e --parallel=3
        env:
          E2E_BROWSERS: chromium

      # The OpenAPI document and the web client generated from it are
      # committed; regenerating must change nothing (A-3.7).
      - name: API client drift
        run: |
          npx nx run web-api-client:generate
          paths="apps/server/openapi.json libs/web/api-client/src/generated"
          # git diff alone ignores untracked files, such as a new tag's client.
          changes=$(git status --porcelain -- $paths)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- $paths
            exit 1
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Production dependencies only: Trivy leaves out npm dev dependencies
      # unless --include-dev-deps is set (NF-11.10).
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests drop superseded runs; pushes to master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nx keeps its cache in ~/.nx by default; inside the workspace, the setup
  # action can save it between runs.
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: ${{ github.workspace }}/.nx/workspace-data
  # Each job saves its own cache; the limit keeps them within the repository's
  # cache storage.
  NX_MAX_CACHE_SIZE: 1GB

# The checks run as parallel jobs, each with its own Nx cache (see
# .github/actions/setup).
# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
jobs:
  lint:
    name: Format, type check, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas reads earlier workflow runs to find the last green commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against an earlier commit.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: lint

      - name: Format
        run: npm run format:check

      - name: Project tags
        run: npm run check:tags

      - name: Type check, lint
        run: npx nx affected -t typecheck lint --parallel=3

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: test

      # One project at a time: each runs its own pool of workers, and with
      # several at once the timing tests (AC-FILE-001.7) miss their limits on
      # the runner's four cores. The job still ends well before the build job.
      - name: Test
        run: npx nx affected -t test --parallel=1

  # End-to-end tests run against the builds, so they share a job.
  build:
    name: Build, end-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: build

      # Here end-to-end tests run in Chromium alone, as its headless shell;
      # nightly.yml runs every browser (NF-12.2).
      - uses: ./.github/actions/playwright
        with:
          targets: e2e

      - name: Build, end-to-end tests
        run: npx nx affected -t build size-check e2e --parallel=3
        env:
          E2E_BROWSERS: chromium

      # The OpenAPI document and the web client generated from it are
      # committed; regenerating must change nothing (A-3.7).
      - name: API client drift
        run: |
          npx nx run web-api-client:generate
          paths="apps/server/openapi.json libs/web/api-client/src/generated"
          # git diff alone ignores untracked files, such as a new tag's client.
          changes=$(git status --porcelain -- $paths)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- $paths
            exit 1
          fi

  # Storybook stories run as browser tests (A-10.38), in Chromium alone.
  storybook:
    name: Storybook tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: storybook

      - uses: ./.github/actions/playwright
        with:
          targets: test-storybook

      - name: Storybook tests
        run: npx nx affected -t test-storybook --parallel=3

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Production dependencies only: Trivy leaves out npm dev dependencies
      # unless --include-dev-deps is set (NF-11.10).
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

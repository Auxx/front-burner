name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests drop superseded runs; pushes to master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas reads earlier workflow runs to find the last green commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against an earlier commit.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0
        with:
          main-branch-name: master

      - name: Format
        run: npm run format:check

      - name: Project tags
        run: npm run check:tags

      # Storybook stories run as browser tests (A-10.38) and web-e2e runs in
      # Chromium, Firefox and WebKit (NF-13.8); browsers are installed only
      # when one of those is affected.
      - name: Find affected browser tests
        id: browsers
        run: |
          storybook=$(npx nx show projects --affected -t test-storybook --json)
          e2e=$(npx nx show projects --affected -t e2e --json)
          echo "Affected by test-storybook: $storybook"
          echo "Affected by e2e: $e2e"
          browsers=""
          if [ "$storybook" != "[]" ]; then browsers="chromium"; fi
          if echo "$e2e" | grep -q '"web-e2e"'; then browsers="chromium firefox webkit"; fi
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browsers
        if: steps.browsers.outputs.browsers != ''
        run: npx playwright install --with-deps ${{ steps.browsers.outputs.browsers }}

      - name: Type check, lint, test, build
        run: npx nx affected -t typecheck lint test build test-storybook e2e --parallel=3

      # The OpenAPI document and the web client generated from it are
      # committed; regenerating must change nothing (A-3.7).
      - name: API client drift
        run: |
          npx nx run web-api-client:generate
          paths="apps/server/openapi.json libs/web/api-client/src/generated"
          # git diff alone ignores untracked files, such as a new tag's client.
          changes=$(git status --porcelain -- $paths)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- $paths
            exit 1
          fi

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Production dependencies only: Trivy leaves out npm dev dependencies
      # unless --include-dev-deps is set (NF-11.10).
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

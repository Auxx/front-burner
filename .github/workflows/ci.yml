name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests drop superseded runs; pushes to master always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Nx keeps its cache in ~/.nx by default; inside the workspace, the setup
  # action can save it between runs.
  NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
  NX_WORKSPACE_DATA_DIRECTORY: ${{ github.workspace }}/.nx/workspace-data
  # Each job saves its own cache; the limit keeps them within the repository's
  # cache storage.
  NX_MAX_CACHE_SIZE: 1GB

# The checks run as parallel jobs, each with its own Nx cache (see
# .github/actions/setup).
# Actions are pinned to commit SHAs (tags can be moved); Dependabot updates them.
jobs:
  lint:
    name: Format, type check, lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas reads earlier workflow runs to find the last green commit.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # nx affected compares against an earlier commit.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: lint

      - name: Format
        run: npm run format:check

      - name: Project tags
        run: npm run check:tags

      - name: Shared Vitest settings
        run: npm run check:vitest

      # The guide's copy of its compose example; on every change, as a change
      # to the guide alone skips the image job.
      - name: Deployment guide
        run: npm run check:guide

      - name: Type check, lint
        run: npx nx affected -t typecheck lint --parallel=3

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: test

      # One project at a time: each runs its own pool of workers, and with
      # several at once the timing tests (AC-FILE-001.7) miss their limits on
      # the runner's four cores. The job still ends well before the build job.
      # The configs give each project 30% of the cores, for 3 projects at once;
      # one at a time takes all but one, as Vitest's own default does.
      - name: Test
        run: npx nx affected -t test --parallel=1
        env:
          VITEST_MAX_WORKERS: 3

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: build

      - name: Build
        run: npx nx affected -t build size-check --parallel=3

      # The OpenAPI document and the web client generated from it are
      # committed; regenerating must change nothing (A-3.7).
      - name: API client drift
        run: |
          npx nx run web-api-client:generate
          paths="apps/server/openapi.json libs/web/api-client/src/generated"
          # git diff alone ignores untracked files, such as a new tag's client.
          changes=$(git status --porcelain -- $paths)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- $paths
            exit 1
          fi

  # End-to-end tests build what they test themselves, from the job's Nx cache
  # when it has the builds; the browser tests (web-e2e) are split into shards.
  server-e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: server-e2e

      - name: API end-to-end tests
        run: npx nx affected -t e2e --exclude=web-e2e --parallel=3

  web-e2e:
    name: Browser end-to-end tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      # Every shard reports its own failures.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: web-e2e-${{ matrix.shard }}

      # Here end-to-end tests run in Chromium alone, as its headless shell;
      # nightly.yml runs every browser (NF-12.2).
      - id: playwright
        uses: ./.github/actions/playwright
        with:
          targets: e2e
          projects: web-e2e

      # The shard is part of the task's cache key, so each shard has its own
      # cache entry.
      - name: Browser end-to-end tests
        if: steps.playwright.outputs.needed == 'true'
        run: npx nx run web-e2e:e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_BROWSERS: chromium

  # Storybook stories run as browser tests (A-10.38), in Chromium alone.
  storybook:
    name: Storybook tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          nx-cache: storybook

      - uses: ./.github/actions/playwright
        with:
          targets: test-storybook

      - name: Storybook tests
        run: npx nx affected -t test-storybook --parallel=3

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Production dependencies only: Trivy leaves out npm dev dependencies
      # unless --include-dev-deps is set (NF-11.10).
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

  # The release image (tools/docker/Dockerfile), built and scanned with Trivy
  # (NF-11.10, NF-11.11). It runs on every push to master, so that a base image
  # or OS package update that brings a vulnerability fails the next push to
  # master. Nothing scans the image on a schedule. A pull request skips it when
  # every changed file is one the image does not contain.
  #
  # After the scan, the container suite of server-e2e runs the image under
  # NF-11.13's hardening: healthy, working, restarted and stopped (plan 138).
  image:
    name: Image build, scan and smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # nx-set-shas, in the setup for the smoke test.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request HEAD is the merge commit; its first parent is
          # the base, so the skip decision needs one commit of history.
          fetch-depth: 2

      # A list of what to skip, not of what to run: a new folder is built and
      # scanned until it is added here. Container suites in server-e2e are not
      # skipped, as this job runs them.
      - name: Changed files
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          image_file() {
            case "$1" in
              # The container suite, with the helpers and the config it runs with.
              apps/server-e2e/*/container*.e2e.spec.ts | apps/server-e2e/src/support/*) return 0 ;;
              apps/server-e2e/project.json | apps/server-e2e/vitest.config.mts) return 0 ;;
              # The deployment guide's compose example, which the suite starts.
              docs/wiki/compose.example.yaml) return 0 ;;
              .github/workflows/ci.yml | .github/actions/*) return 0 ;;
              docs/* | *.md) return 1 ;;
              *.spec.ts | *.stories.ts | .storybook/* | */.storybook/*) return 1 ;;
              apps/web-e2e/* | apps/server-e2e/*) return 1 ;;
              tools/ai-tools/* | tools/lint-rules/*) return 1 ;;
              .github/*) return 1 ;;
            esac
            return 0
          }

          needed=false
          if [ "$EVENT" != pull_request ]; then
            needed=true
          else
            # Exactly what the pull request changes. A failed diff fails the
            # step instead of skipping the scan. Without rename detection, a
            # file moved out of the image is listed under its old path too.
            files=$(git diff --name-only --no-renames HEAD^1 HEAD)
            while IFS= read -r file; do
              if [ -n "$file" ] && image_file "$file"; then
                echo "Changes the image: $file"
                needed=true
                break
              fi
            done <<< "$files"
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          if [ "$needed" = false ]; then
            echo "No changed file goes into the image; skipping the build and the scan."
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.changes.outputs.needed == 'true'

      - name: Build
        if: steps.changes.outputs.needed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/docker/Dockerfile
          tags: front-burner:ci
          load: true
          push: false
          # The base image's newest digest, and the runtime stage (its OS
          # packages) built afresh, so the scan sees what a release build
          # would ship; the build stages still come from the cache.
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Only vulnerabilities with a fix fail the job; one that can't be fixed
      # yet goes into .trivyignore with a reason, never a lower threshold.
      - name: Scan the image
        if: steps.changes.outputs.needed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: front-burner:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore

      - uses: ./.github/actions/setup
        if: steps.changes.outputs.needed == 'true'
        with:
          nx-cache: image

      # The image that was just scanned, not a build of its own.
      - name: Container smoke test
        if: steps.changes.outputs.needed == 'true'
        run: npx nx run server-e2e:e2e-container
        env:
          E2E_IMAGE: front-burner:ci

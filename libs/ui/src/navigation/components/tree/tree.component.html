<cdk-virtual-scroll-viewport
  class="viewport"
  role="tree"
  tabindex="0"
  [itemSize]="itemSize()"
  [attr.aria-label]="label()"
  [attr.aria-activedescendant]="activeDescendant()"
  (keydown)="onKeydown($event)"
  (focusin)="onFocusIn($event)"
  (click)="onClick($event)"
>
  <div
    *cdkVirtualFor="let row of rows(); let index = index; trackBy: trackRow; templateCacheSize: 0"
    class="row"
    role="treeitem"
    [id]="rowId(index)"
    [attr.aria-level]="row.level"
    [attr.aria-setsize]="row.setsize"
    [attr.aria-posinset]="row.posinset"
    [attr.aria-expanded]="row.expandable ? row.expanded : null"
    [attr.aria-selected]="row.selectable ? row.node.value === selected() : null"
    [attr.aria-label]="row.node.accessibleName ?? row.node.label"
    [attr.data-active]="index === activeIndex() ? 'true' : null"
    [style.--ui-tree-level]="row.level"
  >
    <span class="chevron">
      @if (row.expandable) {
        <!-- Codicon chevron-right (CC-BY-4.0), inline until the Icon component exists. -->
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path
            d="M6.14601 3.14579C5.95101 3.34079 5.95101 3.65779 6.14601 3.85279L10.292 7.99879L6.14601 12.1448C5.95101 12.3398 5.95101 12.6568 6.14601 12.8518C6.34101 13.0468 6.65801 13.0468 6.85301 12.8518L11.353 8.35179C11.548 8.15679 11.548 7.83979 11.353 7.64478L6.85301 3.14479C6.65801 2.94979 6.34101 2.95079 6.14601 3.14579Z"
          />
        </svg>
      }
    </span>
    @if (nodeTemplate(); as content) {
      <ng-container
        *ngTemplateOutlet="content.template; context: { $implicit: row.node, level: row.level, expanded: row.expanded }"
      />
    } @else {
      <span class="label">{{ row.node.label }}</span>
    }
  </div>
</cdk-virtual-scroll-viewport>

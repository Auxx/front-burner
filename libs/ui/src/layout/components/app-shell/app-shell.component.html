<a class="skip-link" [href]="'#' + mainId" (click)="skipToMain($event)">{{ skipLinkLabel() }}</a>
<header class="header">
  <ng-content select="[uiAppShellHeader]" />
</header>
<!-- All content must be in a landmark; the activity bar switches between the
side panel's views, so it is navigation, named after the bar. -->
<div
  class="activity"
  [attr.role]="activityBar() ? 'navigation' : null"
  [attr.aria-label]="activityBar()?.label() ?? null"
>
  <ng-content select="ui-activity-bar" />
</div>
<ui-split-pane
  class="body"
  [show]="show()"
  [(size)]="sideSize"
  [separatorLabel]="side()?.resizeLabel() ?? ''"
>
  <div uiSplitPaneStart class="side">
    <ng-content select="[uiAppShellSide]" />
  </div>
  <main #main uiSplitPaneEnd tabindex="-1" [id]="mainId" [attr.aria-label]="mainLabel() ?? null">
    <ng-content />
  </main>
</ui-split-pane>
<div class="status">
  <ng-content select="ui-status-bar" />
</div>

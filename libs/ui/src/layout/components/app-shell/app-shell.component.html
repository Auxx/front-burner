<a class="skip-link" [href]="'#' + mainId" (click)="skipToMain($event)">{{ skipLinkLabel() }}</a>
<header class="header">
  <ng-content select="[uiAppShellHeader]" />
</header>
<div class="activity">
  <ng-content select="ui-activity-bar" />
</div>
<ui-split-pane
  class="body"
  [show]="show()"
  [(size)]="sideSize"
  [separatorLabel]="side()?.resizeLabel() ?? ''"
>
  <div uiSplitPaneStart class="side">
    <ng-content select="[uiAppShellSide]" />
  </div>
  <main #main uiSplitPaneEnd tabindex="-1" [id]="mainId">
    <ng-content />
  </main>
</ui-split-pane>
<div class="status">
  <ng-content select="ui-status-bar" />
</div>

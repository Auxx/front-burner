<ng-container *transloco="let t; prefix: 'web-feature-dashboard.RepositoryEntryComponent'">
  @let repository = this.repository();
  <div class="title">
    @if (openable()) {
      <a class="name"
         [routerLink]="['/repositories', repository.id]">{{ repository.name }}</a>
    } @else {
      <span class="name">{{ repository.name }}</span>
    }
    <shell-repository-status [repository]="repository" />
  </div>
  <span class="remote">{{ repository.remote }}</span>
  <shell-repository-status-detail [repository]="repository" />
  <div class="meta">
    <shell-last-accessed [at]="repository.lastAccessedAt" />
    @if (hasSettingsLink()) {
      <a class="settings"
         [routerLink]="['/repositories', repository.id, 'settings']"
         [attr.aria-label]="t('settingsLabel', { name: repository.name })">{{ t('settings') }}</a>
    }
  </div>
</ng-container>

<ng-container *transloco="let t; prefix: 'web-feature-dashboard.DashboardPage'">
  <h1 class="heading" tabindex="-1">{{ t('heading') }}</h1>
  <dash-add-repository-guide [form]="guideForm()" />
  @if (repositories(); as repositories) {
    @if (repositories.length > 0) {
      <dash-recent-repositories [repositories]="repositories" />
    }
  } @else if (list().kind === 'failed') {
    <ui-inline-banner status="danger" announce>
      {{ t('loadFailed') }}
      <div uiBannerActions>
        <button uiButton size="small" [busy]="retrying()" (click)="retry()">{{ t('retry') }}</button>
      </div>
    </ui-inline-banner>
  } @else {
    <ui-spinner class="loading" [label]="t('loading')" />
  }
</ng-container>

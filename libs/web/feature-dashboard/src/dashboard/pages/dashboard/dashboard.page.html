<ng-container *transloco="let t; prefix: 'web-feature-dashboard.DashboardPage'">
  <ui-page>
    <h1 uiPageTitle>{{ t('heading') }}</h1>
    <shell-add-repository-guide [form]="guideForm()" />
    @if (list.repositories(); as repositories) {
      @if (repositories.length > 0) {
        <dash-recent-repositories [repositories]="repositories" />
      }
    } @else if (list.state().kind === 'failed') {
      <ui-inline-banner status="danger"
                        announce>
        {{ t('loadFailed') }}
        <div uiBannerActions>
          <button uiButton
                  size="small"
                  [busy]="list.retrying()"
                  (click)="retry()">{{ t('retry') }}</button>
        </div>
      </ui-inline-banner>
    } @else {
      <ui-spinner class="loading"
                  [label]="t('loading')" />
    }
  </ui-page>
</ng-container>

<ng-container *transloco="let t; prefix: 'web-shell.AppHeaderComponent'">
  <nav [attr.aria-label]="t('navigation')">
    <shell-brand-link />
    <a class="link wide"
       routerLink="/repositories"
       routerLinkActive="active"
       ariaCurrentWhenActive="page">
      <span class="label"
            [attr.data-label]="t('repositories')">{{ t('repositories') }}</span>
    </a>
    <button uiButton
            variant="ghost"
            class="narrow"
            [uiMenuTrigger]="links.aria">
      <ui-icon name="menu" />
      {{ t('menu') }}
    </button>
    <ui-menu #links="uiMenu">
      <a uiMenuItem="dashboard"
         routerLink="/"
         routerLinkActive="active"
         ariaCurrentWhenActive="page"
         [routerLinkActiveOptions]="{ exact: true }">{{ t('dashboard') }}</a>
      <a uiMenuItem="repositories"
         routerLink="/repositories"
         routerLinkActive="active"
         ariaCurrentWhenActive="page">{{ t('repositories') }}</a>
    </ui-menu>
  </nav>
  <shell-user-menu [user]="user()" />
</ng-container>

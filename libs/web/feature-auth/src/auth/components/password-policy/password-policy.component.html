<ng-container *transloco="let t; prefix: 'web-feature-auth.PasswordPolicyComponent'">
  <p class="heading">{{ t('heading') }}</p>
  <ul>
    @for (item of rules(); track item.rule) {
      <li [attr.data-rule]="item.rule" [attr.data-met]="item.met">
        <ui-icon [name]="item.met ? 'pass' : 'error'" />
        <span>{{ t('rules.' + item.rule) }}</span>
        <span class="cdk-visually-hidden">{{ item.met ? t('met') : t('notMet') }}</span>
      </li>
    }
  </ul>
</ng-container>

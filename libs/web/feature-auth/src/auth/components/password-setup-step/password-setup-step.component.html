<ng-container *transloco="let t; prefix: 'web-feature-auth.PasswordSetupStepComponent'">
  <form novalidate (submit)="submit($event)">
    <h2 class="step-heading">{{ t('heading') }}</h2>
    @if (failure(); as failure) {
      <ui-inline-banner status="danger">
        {{ failure.text }}
        @if (failure.reference) {
          <span class="reference">{{ t('reference') }} <code>{{ failure.reference }}</code></span>
        }
      </ui-inline-banner>
    }
    <ui-field [label]="t('email')" [hint]="t('emailHint')" [error]="errorKey('email') ? t(errorKey('email')!) : undefined">
      <input uiInput type="email" autocomplete="username" [formField]="model.email" />
    </ui-field>
    <ui-field [label]="t('displayName')" [error]="errorKey('displayName') ? t(errorKey('displayName')!) : undefined">
      <input uiInput autocomplete="name" [formField]="model.displayName" />
    </ui-field>
    <div class="password">
      <ui-field [label]="t('password')" [error]="errorKey('password') ? t(errorKey('password')!) : undefined">
        <input uiInput #password type="password" autocomplete="new-password" [formField]="model.password" />
        <button uiIconButton [uiPasswordReveal]="password" [label]="t('showPassword')">
          <ui-icon name="eye" />
        </button>
      </ui-field>
      <ui-strength-meter
        [label]="t('strength')"
        [score]="score()"
        [valueText]="score() === null ? t('strengthEmpty') : t('strengths.' + score())"
      />
      <auth-password-policy [password]="model.password().value()" [email]="model.email().value()" />
    </div>
    <ui-field
      [label]="t('passwordConfirmation')"
      [error]="errorKey('passwordConfirmation') ? t(errorKey('passwordConfirmation')!) : undefined"
    >
      <input
        uiInput
        type="password"
       
        autocomplete="new-password"
        [formField]="model.passwordConfirmation"
      />
    </ui-field>
    <div class="actions">
      <button uiButton (click)="back.emit()">{{ t('back') }}</button>
      <button uiButton variant="primary" type="submit" [busy]="busy()">{{ t('submit') }}</button>
    </div>
  </form>
</ng-container>

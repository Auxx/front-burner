<ng-container *transloco="let t; prefix: 'web-repository-dialogs.commitAuthor'">
  <dl uiKeyValueList>
    <div uiKeyValue [label]="t('name')"><span class="value">{{ author().name }}</span></div>
    <div uiKeyValue [label]="t('email')"><span class="value">{{ author().email }}</span></div>
  </dl>
</ng-container>

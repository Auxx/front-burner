<ng-container *transloco="let t; prefix: 'web-repository-dialogs.CommitAuthorFormComponent'">
  <ng-container *transloco="let e; prefix: 'web-repository-dialogs.errors'">
    <ng-container *transloco="let root">
    @let errors = fieldErrors();
    <ui-field [label]="root('web-repository-dialogs.commitAuthor.name')"
              [error]="errors.name ? e(errors.name) : undefined">
      <input uiInput
             autocomplete="name"
             spellcheck="false"
             [formField]="field().name" />
    </ui-field>
    <div class="email">
      <ui-field [label]="root('web-repository-dialogs.commitAuthor.email')"
                [hint]="t('emailHint')"
                [error]="errors.email ? e(errors.email) : undefined">
        <input uiInput
               autocomplete="email"
               inputmode="email"
               spellcheck="false"
               [formField]="field().email" />
      </ui-field>
      <p class="help">
        <a [href]="githubHelp"
           target="_blank"
           rel="noopener noreferrer">{{ t('githubHelp') }}</a>
        <a [href]="bitbucketHelp"
           target="_blank"
           rel="noopener noreferrer">{{ t('bitbucketHelp') }}</a>
      </p>
    </div>
    </ng-container>
  </ng-container>
</ng-container>

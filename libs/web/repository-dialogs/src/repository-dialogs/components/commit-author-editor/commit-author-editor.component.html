<ng-container *transloco="let t; prefix: 'web-repository-dialogs.CommitAuthorEditorComponent'">
  <ui-dialog [heading]="t('heading')">
    <form class="form" novalidate [id]="formId" (submit)="save($event)">
      @if (failure(); as failure) {
        <ui-inline-banner status="danger" announce>
          {{ failure.text }}
          @if (failure.reference) {
            <span class="reference">{{ t('reference') }} <code>{{ failure.reference }}</code></span>
          }
        </ui-inline-banner>
      }
      @if (fixingDefault()) {
        <ui-inline-banner status="warning" announce>{{ t('fixDefault') }}</ui-inline-banner>
      }
      <dlg-commit-author-form [field]="model" [serverErrors]="refusals.errors()" />
      @if (!fixingDefault()) {
        <ui-segmented-control
          [label]="t('scope')"
          [options]="[
            { value: 'default', label: t('asDefault') },
            { value: 'repository', label: t('forRepository') }
          ]"
          [disabled]="model().submitting()"
          [value]="scope()"
          (valueChange)="scope.set($any($event))"
        />
      }
      @if (dropsOverride()) {
        <p class="note">{{ t('dropsOverride') }}</p>
      }
    </form>
    <div uiDialogFooter>
      <button uiButton [unavailable]="model().submitting()" (click)="cancel()">{{ t('cancel') }}</button>
      <button uiButton variant="primary" type="submit" [attr.form]="formId" [busy]="model().submitting()">
        {{ confirming() ? t('saveAndCommit') : t('save') }}
      </button>
    </div>
  </ui-dialog>
</ng-container>

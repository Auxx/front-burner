<ng-container *transloco="let t; prefix: 'web-repository-dialogs.HttpsCredentialsComponent'">
  <ng-container *transloco="let e; prefix: 'web-repository-dialogs.errors'">
    <ui-segmented-control [label]="t('label')"
                          [options]="choices()"
                          [formField]="credentials().choice" />
    @let errors = fieldErrors();
    @switch (credentials().choice().value()) {
      @case ('saved') {
        <ui-field [label]="t('saved')"
                  [error]="errors.savedId ? e(errors.savedId.key, errors.savedId.params) : undefined">
          <ui-select [options]="savedOptions()"
                     [formField]="credentials().savedId" />
        </ui-field>
      }
      @case ('new-https') {
        <ui-field [label]="t('name')"
                  [error]="errors.name ? e(errors.name.key, errors.name.params) : undefined">
          <input uiInput
                 autocomplete="off"
                 [formField]="credentials().name" />
        </ui-field>
        <ui-field [label]="t('username')"
                  [error]="errors.username ? e(errors.username.key, errors.username.params) : undefined">
          <input uiInput
                 autocomplete="off"
                 spellcheck="false"
                 [formField]="credentials().username" />
        </ui-field>
        <ui-field [label]="t('password')"
                  [hint]="t('passwordHint')"
                  [error]="errors.password ? e(errors.password.key, errors.password.params) : undefined">
          <input uiInput
                 #password
                 type="password"
                 autocomplete="off"
                 [formField]="credentials().password" />
          <button uiIconButton
                  [uiPasswordReveal]="password"
                  [label]="t('showPassword')">
            <ui-icon name="eye" />
          </button>
        </ui-field>
      }
      @case ('none') {
        <p class="hint">{{ t('noneHint') }}</p>
      }
    }
  </ng-container>
</ng-container>

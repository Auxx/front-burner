<ng-container *transloco="let t; prefix: 'web-feature-repositories.HttpsCredentialsComponent'">
  <ng-container *transloco="let e; prefix: 'web-feature-repositories.errors'">
    <ui-segmented-control [label]="t('label')" [options]="choices()" [formField]="credentials().choice" />
    @switch (credentials().choice().value()) {
      @case ('saved') {
        <ui-field [label]="t('saved')" [error]="error('savedId') ? e(error('savedId')!) : undefined">
          <ui-select [options]="savedOptions()" [formField]="credentials().savedId" />
        </ui-field>
      }
      @case ('new-https') {
        <ui-field [label]="t('name')" [error]="error('name') ? e(error('name')!) : undefined">
          <input uiInput autocomplete="off" [formField]="credentials().name" />
        </ui-field>
        <ui-field [label]="t('username')" [error]="error('username') ? e(error('username')!) : undefined">
          <input uiInput autocomplete="off" spellcheck="false" [formField]="credentials().username" />
        </ui-field>
        <ui-field
          [label]="t('password')"
          [hint]="t('passwordHint')"
          [error]="error('password') ? e(error('password')!) : undefined"
        >
          <input uiInput #password type="password" autocomplete="off" [formField]="credentials().password" />
          <button uiIconButton [uiPasswordReveal]="password" [label]="t('showPassword')">
            <ui-icon name="eye" />
          </button>
        </ui-field>
      }
      @case ('none') {
        <p class="hint">{{ t('noneHint') }}</p>
      }
    }
  </ng-container>
</ng-container>

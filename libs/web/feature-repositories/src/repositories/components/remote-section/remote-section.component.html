<ng-container *transloco="let t; prefix: 'web-feature-repositories.RemoteSectionComponent'">
  <ng-container *transloco="let e; prefix: 'web-feature-repositories.errors'">
    <ui-field [label]="t('remoteUrl')" [hint]="t('remoteUrlHint')" [error]="urlError() ? e(urlError()!) : undefined">
      <input uiInput code autocomplete="off" spellcheck="false" [formField]="remoteUrl()" />
    </ui-field>
    @if (duplicates()) {
      <ui-inline-banner class="duplicate" status="warning" quiet announce>{{ t('duplicate', { names: duplicates() }) }}</ui-inline-banner>
    }
    <ui-field
      [label]="t('name')"
      [error]="nameError() ? e(nameError()!, { name: name()().value().trim() }) : undefined"
    >
      <input uiInput autocomplete="off" [formField]="name()" />
    </ui-field>
  </ng-container>
</ng-container>

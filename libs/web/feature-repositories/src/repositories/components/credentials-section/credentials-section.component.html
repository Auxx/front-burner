<ng-container *transloco="let t; prefix: 'web-feature-repositories.CredentialsSectionComponent'">
  <fieldset class="section">
    <legend class="legend">{{ t('heading') }}</legend>
    @if (protocol() === undefined) {
      <p class="placeholder">{{ t('enterUrlFirst') }}</p>
    } @else if (saved() === null) {
      <ui-spinner [label]="t('loading')" />
    } @else if (protocol() === 'https') {
      <repo-https-credentials [credentials]="credentials()" [saved]="saved()!.https" />
    } @else {
      <repo-ssh-credentials [credentials]="credentials()" [keys]="saved()!.sshKeys" />
    }
    @if (sectionError(); as error) {
      <p class="error" *transloco="let e; prefix: 'web-feature-repositories.errors'">
        <ui-icon name="error" />
        <span>{{ e(error.key, error.params) }}</span>
      </p>
    }
  </fieldset>
</ng-container>

<ng-container *transloco="let t; prefix: 'web-feature-repositories.LevelSectionComponent'">
  <ng-container *transloco="let e; prefix: 'web-feature-repositories.errors'">
    @if (options().length > 1) {
      @let failure = error();
      <ui-field [label]="t('label')" [hint]="t('hint')" [error]="failure ? e(failure.key, failure.params) : undefined">
        <ui-select [options]="options()" [formField]="gitLevel()" />
      </ui-field>
    }
  </ng-container>
</ng-container>

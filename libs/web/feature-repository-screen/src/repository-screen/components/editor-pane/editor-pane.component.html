<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.EditorPaneComponent'">
  @if (file().draft(); as draft) {
    <rs-draft-offer [draft]="draft" (restore)="restore()" (discard)="discard()" />
  }
  @if (file().gone()) {
    <rs-gone-elsewhere [error]="file().recreateError()" (recreate)="recreate()" />
  } @else if (file().changed() !== null) {
    <rs-changed-on-disk
      [existsAgain]="file().recreateError()?.code === 'entry-exists'"
      (reload)="reload()"
      (keepMine)="keepMine()"
    />
  }
  @if (noteShown()) {
    <rs-large-file-note (turnOn)="file().highlight.set(true)" />
  }
  <div class="toolbar">
    <button uiButton variant="ghost" size="small" (click)="openSearch()">{{ t('find') }}</button>
  </div>
  <ui-split-pane
    class="panes"
    [show]="narrow() ? 'start' : 'both'"
    [(size)]="editorSize"
    [separatorLabel]="t('resizePreview')"
  >
    <ce-code-editor uiSplitPaneStart class="editor" [state]="state()" (stateChange)="changed($event)" />
    @if (!narrow()) {
      <md-preview
        uiSplitPaneEnd
        [source]="file().preview"
        [path]="file().path()"
        [label]="name()"
        [fragment]="fragment()"
        (openPath)="openPath.emit($event)"
      />
    }
  </ui-split-pane>
</ng-container>

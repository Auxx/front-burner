<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.EditorAreaComponent'">
  @if (path(); as path) {
    @if (entry() !== undefined) {
      @if (markdown()) {
        <ui-empty-state icon="markdown" [heading]="name()">{{ t('later') }}</ui-empty-state>
      } @else {
        <rs-entry-message [entry]="entry() ?? null" [path]="path" (action)="action.emit($event)" />
      }
    }
  } @else if (path() === null) {
    <ui-empty-state icon="markdown">
      {{ t('empty') }}
      <div uiEmptyStateActions>
        <button uiButton variant="primary" (click)="newFile.emit()">{{ t('newFile') }}</button>
      </div>
    </ui-empty-state>
  }
</ng-container>

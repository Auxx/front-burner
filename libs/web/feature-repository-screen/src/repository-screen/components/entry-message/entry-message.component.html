<ui-empty-state
  *transloco="let t; prefix: 'web-feature-repository-screen.EntryMessageComponent'"
  icon="info"
  [heading]="name()"
>
  {{ t(reason()) }}
  @if (deletable()) {
    <div uiEmptyStateActions>
      <button uiButton (click)="action.emit('delete')">{{ t('delete') }}</button>
    </div>
  }
</ui-empty-state>

<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.ChangesPaneComponent'">
  @if (store.failed()) {
    <ui-inline-banner class="failed"
                      status="warning"
                      announce>
      {{ t('failed') }}
      <div uiBannerActions>
        <button uiButton
                size="small"
                (click)="store.refresh()">{{ t('retry') }}</button>
      </div>
    </ui-inline-banner>
  }
  @let changes = store.status()?.changes;
  @if (changes === undefined) {
    @if (!store.failed()) {
      <ui-spinner class="loading"
                  [label]="t('loading')" />
    }
  } @else if (changes.length === 0) {
    <ui-empty-state class="empty"
                    icon="check">{{ t('empty') }}</ui-empty-state>
  } @else {
    <div class="actions">
      @let allState = ticks.allState();
      <label uiChoice
             class="all">
        <input type="checkbox"
               uiCheckbox
               [attr.aria-checked]="allState === 'some' ? 'mixed' : null"
               [checked]="allState === 'all'"
               [indeterminate]="allState === 'some'"
               (change)="ticks.setAll(allState !== 'all')" />
        {{ t('tickAll') }}
      </label>
      <button #discardAll
              uiButton
              class="discard-all"
              size="small"
              (click)="discard.emit(changes)">
        {{ t('discardAll') }}
      </button>
    </div>
    <cdk-virtual-scroll-viewport class="list"
                                 role="list"
                                 [attr.aria-label]="t('label')"
                                 [itemSize]="rowHeight()">
      <rs-change-entry *cdkVirtualFor="let change of changes; let index = index; trackBy: trackChange"
                       [change]="change"
                       [selected]="change.path === selected()"
                       [ticked]="tickedPaths()[change.path] === true"
                       [attr.aria-posinset]="index + 1"
                       [attr.aria-setsize]="changes.length"
                       (selectPath)="selectPath.emit($event)"
                       (tickedChange)="ticks.setTicked(change.path, $event)"
                       (discard)="discard.emit([ $event ])" />
    </cdk-virtual-scroll-viewport>
  }
  @if (changes !== undefined) {
    <rs-commit-form />
  }
  <div #rowProbe
       class="row-probe"
       aria-hidden="true"></div>
</ng-container>

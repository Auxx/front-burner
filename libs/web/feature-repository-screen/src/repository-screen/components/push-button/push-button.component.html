<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.PushButtonComponent'">
  @let why = reason();
  @if (narrow()) {
    <button uiIconButton [uiMenuTrigger]="actions.aria" [label]="t('gitActions')" [busy]="running()">
      <ui-icon name="repo-push" />
    </button>
    <ui-menu #actions="uiMenu" (itemSelected)="choose()">
      <button uiMenuItem="push" [disabled]="running() || why !== null">
        <ui-icon name="repo-push" />
        {{ running() ? t('pushing') : t('push') }}
        @if (why !== null && !running()) {
          <span class="reason">{{ t('reasons.' + why) }}</span>
        }
      </button>
    </ui-menu>
  } @else if (why !== null && !running()) {
    <button uiButton variant="ghost" size="small" unavailable uiTooltipShowOnClick [uiTooltip]="t('reasons.' + why)">
      <ui-icon name="repo-push" />
      {{ t('push') }}
    </button>
  } @else {
    <button uiButton variant="ghost" size="small" [busy]="running()" (click)="choose()">
      <ui-icon name="repo-push" />
      {{ running() ? t('pushing') : t('push') }}
    </button>
  }
  <!-- Not a `status` role: the bar's status is the save status (ED-18). -->
  <span class="cdk-visually-hidden" aria-live="polite">{{ running() ? t('pushing') : '' }}</span>
</ng-container>

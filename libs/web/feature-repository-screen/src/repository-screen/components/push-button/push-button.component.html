<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.PushButtonComponent'">
  @let why = reason();
  @let pushing = running();
  @if (narrow()) {
    <button uiIconButton
            [uiMenuTrigger]="actions.aria"
            [label]="t('gitActions')"
            [busy]="pushing">
      <ui-icon name="repo-push" />
    </button>
    <ui-menu #actions="uiMenu"
             (itemSelected)="choose()">
      <button uiMenuItem="push"
              [disabled]="pushing || why !== null">
        <ui-icon name="repo-push" />
        {{ pushing ? t('pushing') : t('push') }}
        @if (why !== null && !pushing) {
          <span class="reason">{{ t('reasons.' + why) }}</span>
        }
      </button>
    </ui-menu>
  } @else if (why !== null && !pushing) {
    <button uiButton
            variant="ghost"
            size="small"
            unavailable
            uiTooltipShowOnClick
            [uiTooltip]="t('reasons.' + why)">
      <ui-icon name="repo-push" />
      {{ t('push') }}
    </button>
  } @else {
    <button uiButton
            variant="ghost"
            size="small"
            [busy]="pushing"
            (click)="choose()">
      <ui-icon name="repo-push" />
      {{ pushing ? t('pushing') : t('push') }}
    </button>
  }
  <!-- Not a `status` role: the bar's status is the save status (ED-18). -->
  <span class="cdk-visually-hidden"
        aria-live="polite">{{ pushing ? t('pushing') : '' }}</span>
</ng-container>

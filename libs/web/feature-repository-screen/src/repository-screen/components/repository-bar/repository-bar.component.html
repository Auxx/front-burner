<shell-brand-link [compact]="narrow()" />
<rs-repository-switcher class="name"
                        [repository]="repository()"
                        [narrow]="narrow()" />
@if (withFiles()) {
  <ng-container *transloco="let root">
    @let headline = fetchHeadline();
    @let warning = headline ? root(headline.key, headline.params) : null;
    @if (merging()) {
      <rs-merge-summary [state]="mergeState()"
                        [narrow]="narrow()"
                        [busy]="aborting()"
                        [warning]="warning"
                        (abortMerge)="abortMerge.emit()"
                        (commit)="commitMerge.emit()"
                        (showWarning)="showFetchDetails()" />
    } @else {
      <rs-git-status-summary [status]="gitStatus()"
                             [switching]="switching()"
                             (openBranches)="openBranches.emit()" />
      <rs-git-actions [status]="gitStatus()"
                      [running]="running()"
                      [switching]="switching()"
                      [narrow]="narrow()"
                      [warning]="warning"
                      (fetch)="fetch.emit()"
                      (pull)="pull.emit()"
                      (push)="push.emit()"
                      (showWarning)="showFetchDetails()" />
    }
  </ng-container>
  <rs-fetch-status [problem]="gitStatus()?.fetchProblem ?? null"
                   [lockedKeyName]="lockedKeyName()"
                   [running]="running()"
                   [narrow]="narrow()"
                   (retry)="retryFetch.emit()"
                   (fix)="fixFetch.emit($event)"
                   (unlock)="unlock.emit()"
                   (vacate)="focusActions()" />
  <rs-save-status class="status"
                  [status]="saveStatus()" />
}
@if (user(); as user) {
  <shell-user-menu class="user"
                   [user]="user" />
}

<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.RepositoryBarComponent'">
  <shell-brand-link [compact]="narrow()" />
  <h1 class="name">{{ repository().name }}</h1>
  @if (withFiles()) {
    <button
      uiButton
      variant="ghost"
      class="files"
      [attr.aria-expanded]="filesOpen()"
      (click)="toggleFiles.emit()"
    >
      <ui-icon name="files" />
      {{ t('files') }}
    </button>
  }
  @if (user(); as user) {
    <shell-user-menu class="user" [user]="user" />
  }
</ng-container>

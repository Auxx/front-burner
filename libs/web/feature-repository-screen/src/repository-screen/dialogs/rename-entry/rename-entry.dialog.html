<ng-container *transloco="let t; prefix: 'web-feature-repository-screen'">
  <ui-dialog [heading]="t('RenameEntryDialog.heading')">
    <form novalidate [id]="formId" (submit)="rename($event)">
      @if (failure(); as failure) {
        <ui-inline-banner status="danger" announce>
          {{ failure.text }}
          @if (failure.reference) {
            <span class="reference">{{ t('RenameEntryDialog.reference') }} <code>{{ failure.reference }}</code></span>
          }
        </ui-inline-banner>
      }
      <ui-field
        [label]="t('RenameEntryDialog.name')"
        [hint]="showFinalName() ? t('RenameEntryDialog.finalName', { name: finalName() }) : undefined"
        [error]="error() ? t('nameErrors.' + error()) : undefined"
      >
        <input uiInput #name autocomplete="off" spellcheck="false" [formField]="model.name" />
      </ui-field>
      @if (ignored()) {
        <ui-inline-banner status="warning">{{ t('RenameEntryDialog.ignored.' + kind) }}</ui-inline-banner>
      }
    </form>
    <div uiDialogFooter>
      <button uiButton [unavailable]="busy()" (click)="ref.close()">{{ t('RenameEntryDialog.cancel') }}</button>
      <button uiButton variant="primary" type="submit" [attr.form]="formId" [busy]="busy()">
        {{ t('RenameEntryDialog.rename') }}
      </button>
    </div>
  </ui-dialog>
</ng-container>

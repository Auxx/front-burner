<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.NewBranchDialog'">
  <ui-dialog [heading]="t('heading')">
    <form novalidate
          [id]="formId"
          (submit)="confirm($event)">
      @if (failure(); as failure) {
        <ui-inline-banner status="danger"
                          announce>
          {{ failure.text }}
          @if (failure.reference) {
            <span class="reference">{{ t('reference') }} <code>{{ failure.reference }}</code></span>
          }
        </ui-inline-banner>
      }
      <ui-field [label]="t('name')"
                [error]="error() ? t('errors.' + error()) : undefined">
        <input uiInput
               #name
               autocomplete="off"
               autocapitalize="off"
               spellcheck="false"
               [formField]="model.name" />
      </ui-field>
    </form>
    <div uiDialogFooter>
      <button uiButton
              [unavailable]="busy()"
              (click)="ref.close()">{{ t('cancel') }}</button>
      <button uiButton
              variant="primary"
              type="submit"
              [attr.form]="formId"
              [busy]="busy()">
        {{ t('submit') }}
      </button>
    </div>
  </ui-dialog>
</ng-container>

<ng-container *transloco="let t; prefix: 'web-feature-repository-screen.StartOverDialog'">
  <ui-dialog [heading]="t('heading')">
    <p class="message">{{ t('message') }}</p>
    <div uiDialogFooter>
      <button uiButton
              data-autofocus
              (click)="ref.close(false)">{{ t('cancel') }}</button>
      <button uiButton
              variant="danger"
              (click)="ref.close(true)">{{ t('startOver') }}</button>
    </div>
  </ui-dialog>
</ng-container>
